<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ovozlar Boshqaruvi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="adminpanel.css">
</head>
<body>

    <div class="admin-container">
        <h1><i class="fa-solid fa-user-shield"></i> Admin Panel — Ovozlar Boshqaruvi</h1>

        <!-- Umumiy Statistika -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Rasm 1 (Asar 1)</h3>
                <p id="admin-count-1">0 ovoz</p>
            </div>
            <div class="stat-card">
                <h3>Rasm 2 (Asar 2)</h3>
                <p id="admin-count-2">0 ovoz</p>
            </div>
            <div class="stat-card">
                <h3>Rasm 3 (Asar 3)</h3>
                <p id="admin-count-3">0 ovoz</p>
            </div>
        </div>

        <!-- Ovoz berganlar ro'yxati -->
        <h2 class="voters-title">Ovoz bergan raqamlar ro'yxati</h2>
        <div id="votersList" class="voters-list">
            <!-- JS orqali dinamik to'ldiriladi -->
        </div>
    </div>


    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  window.db = firebase.database();
</script>

<script src="adminpanel.js"></script>

</body>
</html>
